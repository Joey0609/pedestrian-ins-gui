<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>行迹 — 多设备惯导控制</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: ws: http:;">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Applied before the first paint so the window never flashes the wrong theme. -->
  <script>
    (function () {
      var pref = 'system';
      try {
        var stored = localStorage.getItem('wj.theme-preference');
        if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
      } catch (e) { /* storage unavailable: fall back to the system preference */ }
      var dark = pref === 'dark' ||
        (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePref = pref;
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="topbar">
    <div class="topbar-group topbar-group-main">
      <button id="btn-scan-ips" class="btn btn-primary" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg>
        <span class="btn-text">扫描 IP</span>
      </button>
      <button id="btn-scan-serial" class="btn btn-outline" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z"/><path d="M9 4v4M15 4v4M8 13h.01M12 13h.01M16 13h.01"/></svg>
        <span class="btn-text">扫描串口</span>
      </button>
      <span class="topbar-divider" role="separator" aria-hidden="true"></span>
      <button id="btn-record" class="btn btn-ghost" type="button">
        <span class="record-dot" hidden></span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/></svg>
        <span class="btn-text record-text">录制</span>
      </button>
      <button id="btn-zero" class="btn btn-ghost" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l2.5 2.5"/></svg>
        <span class="btn-text">方向归零</span>
      </button>
      <button id="btn-inertial" class="btn btn-ghost" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M21 3v6h-6"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span class="btn-text">惯导重置</span>
      </button>
      <button id="btn-ota" class="btn btn-ghost btn-accent" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        <span class="btn-text">在线升级</span>
      </button>
    </div>
    <div class="topbar-group topbar-group-tail">
      <button id="btn-disconnect" class="btn btn-ghost" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18.8 5.2-3.6 3.6"/><path d="M15.9 2.3 21.7 8.1"/><path d="m5.2 18.8 3.6-3.6"/><path d="M2.3 15.9 8.1 21.7"/><path d="m9.5 9.5 5 5"/><path d="M14.5 9.5 19 5a2.1 2.1 0 0 1 3 3l-4.5 4.5"/><path d="M4.9 15.5 9.5 11"/></svg>
        <span class="btn-text">断开连接</span>
      </button>
      <button id="btn-shutdown" class="btn btn-ghost btn-danger-ghost" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>
        <span class="btn-text">关机</span>
      </button>
      <button id="btn-check-update" class="btn btn-ghost btn-icon-only" type="button" title="检查更新" aria-label="检查更新">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>

  <div id="content">
    <div id="page-device-attitude" class="page active">
      <div id="grid"></div>
    </div>
    <div id="page-device-track" class="page">
      <canvas id="track-canvas"></canvas>

      <div class="track-hud track-hud-top-left">
        <div id="track-chips" class="track-chips"></div>
      </div>

      <div class="track-hud track-hud-top-right">
        <div class="track-seg" id="track-window-toggle" role="group" aria-label="轨迹时间窗">
          <button type="button" data-sec="5">5s</button>
          <button type="button" data-sec="30">30s</button>
          <button type="button" data-sec="0" class="active">全部</button>
        </div>
        <button type="button" id="track-replay" class="track-icon-btn" title="回放轨迹（空格）" aria-label="回放轨迹">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        </button>
        <button type="button" id="track-panel-toggle" class="track-icon-btn" title="轨迹设置" aria-label="轨迹设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>

      <div class="track-hud track-hud-bottom-left">
        <div class="track-compass" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m8 7 4-4 4 4"/></svg>
          <span>N</span>
        </div>
        <div class="track-scale">
          <div class="track-scale-bar" id="track-scale-bar"></div>
          <span id="track-scale-label">—</span>
        </div>
      </div>

      <div class="track-hud track-hud-bottom-right">
        <button type="button" id="track-zoom-out" class="track-icon-btn" title="缩小" aria-label="缩小">−</button>
        <button type="button" id="track-zoom-in" class="track-icon-btn" title="放大" aria-label="放大">+</button>
        <button type="button" id="track-fit" class="track-icon-btn" title="适应窗口（双击画布）" aria-label="适应窗口">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <span id="track-zoom-label" class="track-zoom-label">100%</span>
      </div>

      <div id="track-tooltip" class="track-tooltip hidden" aria-hidden="true"></div>

      <aside id="track-panel" class="track-panel" aria-hidden="true">
        <div class="track-panel-head">
          <strong>轨迹设置</strong>
          <button type="button" id="track-panel-close" class="track-icon-btn" title="关闭" aria-label="关闭">×</button>
        </div>
        <div class="track-panel-actions">
          <button type="button" id="fit-window">适应窗口</button>
          <button type="button" id="clear-tracks">清空轨迹</button>
        </div>
        <div class="track-hint">
          <span class="track-hint-item"><span class="track-hint-mark track-hint-start"></span>起点</span>
          <span class="track-hint-item"><span class="track-hint-mark track-hint-current"></span>当前</span>
          <span class="track-hint-item">滚轮缩放 · 拖拽平移</span>
        </div>
        <div id="track-legend"></div>
      </aside>
    </div>
    <!-- Device detail pages container - dynamically created iframes -->
    <div id="device-pages-container"></div>
  </div>

  <div id="bottombar">
    <div class="tab-container">
      <div class="tab-slider"></div>
      <button data-page="attitude" class="page-tab active">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <span>设备姿态</span>
      </button>
      <button data-page="track" class="page-tab">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>设备轨迹</span>
      </button>
      <div id="device-tabs"></div>
    </div>
    <div class="bottombar-info">
      <div class="status-monitor" aria-label="实时监测">
        <span class="status-item"><span class="status-label">缓存</span><strong id="runtime-cache">--</strong></span>
        <span class="status-divider" aria-hidden="true"></span>
        <span class="status-item"><span class="status-label">内存</span><strong id="runtime-memory">--</strong></span>
        <span class="status-divider" aria-hidden="true"></span>
        <span class="status-item"><span class="status-label">CPU</span><strong id="runtime-cpu">--</strong></span>
      </div>
      <button id="btn-theme" class="theme-toggle" type="button" title="主题：跟随系统（点击切换）" aria-label="切换主题"></button>
      <span id="connection-count">0 台设备</span>
    </div>
  </div>

  <div id="modal" class="hidden" aria-hidden="true"></div>

  <div class="notification-container" id="notificationContainer"></div>

  <!-- Three.js example loaders internally import the bare "three" specifier. -->
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="renderer.js"></script>
</body>

</html>
