<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>行迹 — 多设备惯导控制</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: ws: http:;">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="topbar">
    <!-- '扫描端口' 按钮已移除 -->
    <button id="btn-scan-ips">扫描IP</button>
    <button id="btn-disconnect">断开连接</button>
    <button id="btn-record">录制</button>
    <button id="btn-zero">方向归零</button>
    <button id="btn-inertial">惯导重置</button>
    <button id="btn-shutdown">关机</button>
    <div class="topbar-monitor" aria-label="实时监测">
      <div class="topbar-monitor-title">实时监测</div>
      <div class="topbar-monitor-item">
        <span class="topbar-monitor-label">内存</span>
        <strong id="runtime-memory">--</strong>
      </div>
      <div class="topbar-monitor-item">
        <span class="topbar-monitor-label">CPU</span>
        <strong id="runtime-cpu">--</strong>
      </div>
    </div>
  </div>

  <div id="content">
    <div id="page-device-attitude" class="page active">
      <div id="grid"></div>
    </div>
    <div id="page-device-track" class="page">
      <div id="track-sidebar">
        <div id="track-controls">
          <button id="clear-tracks">清空轨迹</button>
          <button id="fit-window">适应窗口</button>
          <button id="replay-tracks">回放轨迹</button>
        </div>
        <div id="track-legend"></div>
      </div>
      <div id="track-main">
        <canvas id="track-canvas"></canvas>
      </div>
    </div>
    <!-- Device detail pages container - dynamically created iframes -->
    <div id="device-pages-container"></div>
  </div>

  <div id="bottombar">
    <div class="tab-container">
      <div class="tab-slider"></div>
      <button data-page="attitude" class="page-tab active">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <span>设备姿态</span>
      </button>
      <button data-page="track" class="page-tab">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>设备轨迹</span>
      </button>
      <div id="device-tabs"></div>
    </div>
    <div class="bottombar-info">
      <span id="connection-count">0 台设备</span>
    </div>
  </div>

  <div id="modal" class="hidden"></div>

  <div class="notification-container" id="notificationContainer"></div>

  <!-- local three UMD (if you installed three via npm, replace this with /node_modules/three/build/three.min.js) -->
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="renderer.js"></script>
</body>

</html>
