name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的现有版本标签，例如 v1.1.18"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 校验发布版本
        run: node -e "const version = require('./package.json').version; if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('Release tag must match package version');"

      - name: 安装依赖
        run: npm ci

      - name: 构建安装包
        run: npm run dist -- --publish never --config.artifactName='${name}-Setup-${version}.${ext}'

      - name: 校验自动更新文件
        run: |
          node -e "const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto'), yaml = require('js-yaml'); const dir = 'dist-installer', manifest = yaml.load(fs.readFileSync(path.join(dir, 'latest.yml'), 'utf8')); if (String(manifest.version) !== require('./package.json').version || !manifest.files?.length) throw new Error('Invalid update manifest'); for (const file of manifest.files) { const name = decodeURIComponent(file.url); if (!/^[A-Za-z0-9._-]+$/.test(name)) throw new Error('Release filename must be ASCII-safe'); const bytes = fs.readFileSync(path.join(dir, name)); if (crypto.createHash('sha512').update(bytes).digest('base64') !== file.sha512 || bytes.length !== file.size) throw new Error('Installer does not match update manifest'); if (!fs.existsSync(path.join(dir, name + '.blockmap'))) throw new Error('Missing differential blockmap'); } console.log('Update manifest, installer and blockmap verified');"

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist-installer/*.exe
            dist-installer/*.exe.blockmap
            dist-installer/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
